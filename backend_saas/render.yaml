# ============================================================
# CampsPilot SaaS API — Render service reference config.
#
# Same convention as backend/render.yaml (KSV): this documents the intended
# Render settings, but production deployment for this repo is currently
# done via manual Render Dashboard configuration, not an auto-applied
# Blueprint — see README.md "Deployment" for the exact manual steps.
# (Render only auto-detects render.yaml from the repo root; this file
# lives next to the service it describes for discoverability. If you ever
# do want to drive this as a real Blueprint, it needs to be referenced
# from a repo-root render.yaml — rootDir below already anticipates that.)
#
# This is a COMPLETELY SEPARATE Render service from backend/render.yaml's
# ksv-baunatal-backend — different name, different rootDir, different
# database, no shared env vars. Creating/editing this file does not touch
# the KSV service or its configuration in any way.
# ============================================================

services:
  - type: web
    name: campspilot-saas-backend
    runtime: python
    region: frankfurt          # physically close to the Supabase eu-central-1 project
    plan: starter              # Starter plan — no cold starts in production (upgraded 2026-10-18)
    rootDir: backend_saas
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: CampsPilot SaaS API
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false           # set manually in Render Dashboard — CampsPilot SaaS project
                               # (ref wkmckfbzhmihyfwiekct) ONLY. Never Sommercamps/KSV, never JK.
      - key: CORS_ORIGINS_EXTRA
        sync: false           # comma-separated extra allowed origins; empty until a real
                               # frontend exists — see README.md "CORS"
      - key: NOTIFICATION_PROVIDER
        sync: false           # "brevo" for real mail. Unset/unknown: skip in local/test, error elsewhere (see mail.py)
      - key: BREVO_API_KEY
        sync: false           # required when NOTIFICATION_PROVIDER=brevo; get from Brevo Dashboard
      - key: NOTIFICATION_FROM_EMAIL
        sync: false           # sender address (SPF/DKIM-verifizierte Domain in Brevo); default noreply@campspilot.app
        # Absendername ist dynamisch: "{org_name} über CampsPilot" — kein NOTIFICATION_FROM_NAME mehr nötig
      - key: FRONTEND_BASE_URL
        sync: false           # Pflicht: HTTPS-Origin des Frontends ohne Pfad. Prod: https://campspilot.vercel.app,
                               # Staging: Vercel-Branch-URL von demo/jan. Ohne Wert werden Signup-/Freigabemails blockiert.
      - key: NOTIFICATION_ALLOWED_RECIPIENTS
        sync: false           # NUR Staging/Nicht-Produktion: kommagetrennte Test-Empfänger
                               # (z. B. "qa@deine-domain.de,@example.com"). Ohne Eintrag wird
                               # außerhalb von APP_ENV=production JEDE Mail blockiert.
      - key: TRUSTED_CLIENT_IP_HEADER
        sync: false           # Header mit der echten Besucher-IP, den der Edge-Proxy setzt (Render: vermutlich "cf-connecting-ip", nach dem Setzen im Log prüfen).
                               # Ohne Wert bleibt das Anmelde-Limit pro IP aus (Log-Warnung "rate limit inactive"),
                               # weil sonst alle Eltern hinter der Proxy-IP gemeinsam gesperrt würden.
      - key: REGISTRATION_RATE_LIMIT_PER_HOUR
        sync: false           # optional, Standard 30 Elternanmeldungen pro IP und Stunde
