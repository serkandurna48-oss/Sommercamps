name: Daily jobs

# Calls the SaaS API once a day: health-data retention and parent reminder mails.
# Runs only when the repository variable SAAS_API_URL (e.g. https://<service>.onrender.com,
# no trailing slash) and the secret CRON_SECRET (same value as on the API) are both set.
# A non-2xx answer fails the run, so GitHub mails the repository owner.
# The response contains counts only (no personal data).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SAAS_API_URL: ${{ vars.SAAS_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip when not configured
        if: ${{ env.SAAS_API_URL == '' || env.CRON_SECRET == '' }}
        run: echo "SAAS_API_URL or CRON_SECRET is not set - nothing to do."
      - name: Run daily jobs
        if: ${{ env.SAAS_API_URL != '' && env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          # The secret is passed via a header file so it never appears in the process list.
          printf 'Authorization: Bearer %s\n' "$CRON_SECRET" > "$RUNNER_TEMP/cron-header"
          code=$(curl --silent --show-error --max-time 300 --retry 2 --retry-connrefused \
            --output "$RUNNER_TEMP/cron-response.json" --write-out '%{http_code}' \
            --request POST --header "@$RUNNER_TEMP/cron-header" \
            "${SAAS_API_URL%/}/internal/cron/daily")
          rm -f "$RUNNER_TEMP/cron-header"
          cat "$RUNNER_TEMP/cron-response.json"; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Daily jobs answered HTTP $code" >&2
            exit 1
          fi
