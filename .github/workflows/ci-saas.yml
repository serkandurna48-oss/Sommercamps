name: SaaS checks

# Check the shared SaaS architecture on every PR, not only PRs targeting main.
# No production secrets, deployments or customer migrations. Postgres
# integration checks run ONLY on a fresh CI service bound to localhost:55443.
on:
  pull_request:
  push:
    branches: [demo/jan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-saas:
    name: saas-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_ephemeral_password
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend_saas
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/not_a_real_database
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_ANON_KEY: test-anon-key-not-real
      REVIEW_POSTGRES_PORT: "55443"
      PGPASSWORD: ci_only_ephemeral_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_saas/requirements.txt
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Unit, API and disposable Postgres integration tests
        run: python -m pytest -q tests
      - name: Compile API
        run: python -m compileall -q app

  frontend-saas:
    name: saas-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SAAS_API_URL: http://127.0.0.1:8001
      NEXT_PUBLIC_ACTIVE_CLUB: ksv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: All frontend regression tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
